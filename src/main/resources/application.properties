spring.application.name=customerservice

spring.datasource.url=jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.data.mongodb.uri=mongodb://localhost:27017/customer_audit_db

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

app.policies=classpath:policies/policy.yml
app.
app.credsFilePath=src/main/resources/policies/global.secret.enc.properties
app.certStorePath=src/main/resources
bpi.backendadapter.enabled=true

bpi.api.inquire-branch.basePath=http://localhost:3000/inquire-branch
bpi.api.inquire-branch.connect-timeout=10000
bpi.api.inquire-branch.socket-timeout=10000


bpi.soap.wsrvalng.endpoint-url=http://localhost:3000/soap/validateAcctNumber
bpi.soap.wsrvalng.connect-timeout=10000
bpi.soap.wsrvalng.read-timeout=10000

bpi.soap.api.configure.enabled=true

soap.inquire-customer.endpoint-url=http://localhost:3000/soap/inquire-customer